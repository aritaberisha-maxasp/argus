  <div style="padding: 56px; display: flex; flex-direction: column; gap: 38px">

        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 26px; font-weight: 500; letter-spacing: 0.22em">ARGUS</span>
          <span style="font-size: 13px; color: #475467">Max ASP</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #475467">Favicon sizes</span>
      <div style="display: flex; align-items: flex-end; gap: 32px">

          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0C0D0F"></rect><path d="M17 48L32 17L47 48" fill="none" stroke="#ECEEF1" stroke-width="7" stroke-linejoin="miter"></path><circle cx="32" cy="38" r="4.5" fill="#7C9CFF"></circle></svg>
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #475467">64</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0C0D0F"></rect><path d="M17 48L32 17L47 48" fill="none" stroke="#ECEEF1" stroke-width="7" stroke-linejoin="miter"></path><circle cx="32" cy="38" r="4.5" fill="#7C9CFF"></circle></svg>

          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #475467">16</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #475467">In the browser tab</span>
      <div style="background: #DEE1E6; border-radius: 12px 12px 0 0; padding: 8px 8px 0; display: flex">
        <div style="background: #FFFFFF; border-radius: 10px 10px 0 0; height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 10px; width: 260px; font-family: system-ui, sans-serif; font-size: 13px; color: #1F2937">

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #475467">Palette</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 44px; border-radius: 8px; background: #0C0D0F"></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #344054">Ink #0C0D0F</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 44px; border-radius: 8px; background: #7C9CFF"></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #344054">Signal #7C9CFF</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 44px; border-radius: 8px; background: #F5B759"></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #344054">Flag #F5B759</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 44px; border-radius: 8px; background: #ECEEF1; border: 1px solid #D0D5DD"></span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #344054">Paper #ECEEF1</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
