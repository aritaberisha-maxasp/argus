name: Spike
description: A time boxed investigation that answers a question
labels: ["spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: reqs
    attributes:
      label: Requirement IDs
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: For example an ADR, a short report, or a working prototype.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: Two nights
