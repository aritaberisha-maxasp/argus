name: Bug
description: Something does not work as the requirements say
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens and what should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: input
    id: reqs
    attributes:
      label: Requirement IDs affected
