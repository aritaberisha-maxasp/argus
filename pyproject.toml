[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Finance back office automation for Max ASP GmbH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "azure-storage-blob>=12.20,<13",
    "fastapi>=0.115,<1",
    "holidays>=0.60,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    # reads the text layer of PDF invoices (docs/design/invoice-reading.md)
    "pypdf>=5.0,<6",
    "sqlalchemy>=2.0.36,<3",
    # zoneinfo needs the IANA time zone data on hosts that do not ship it
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    # serves the fake DATEV locally (docs/design/datev-gateway.md)
    "uvicorn>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the stand ins in standins/
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "req(*ids): requirement IDs from docs/requirements/requirements.md that this test covers",
    "waits_on(*issues): an acceptance scenario whose feature is not built yet; shows as not run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The fixture generator is a standalone script with its own style; check.py still runs in CI.
# Spike code is a throwaway prototype (see docs/team/roles/architect.md) and is rewritten in a story.
extend-exclude = ["tests/fixtures/tools", "spikes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["argus", "standins", "tests"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "standins", "tests", "tools"]
exclude = ["tests/fixtures/tools/"]
