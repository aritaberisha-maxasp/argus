name: Story
description: A piece of user facing functionality
labels: ["story"]
body:
  - type: textarea
    id: what
    attributes:
      label: What and for whom
      description: In plain language, what changes and who benefits.
    validations:
      required: true
  - type: input
    id: reqs
    attributes:
      label: Requirement IDs
      placeholder: IN-04, IN-09
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Each one checkable with a clear yes or no.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test cases (QA)
  - type: textarea
    id: tech
    attributes:
      label: Technical notes (Architect)
  - type: input
    id: deps
    attributes:
      label: Depends on
      placeholder: "#12, #15"
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (a night)", "M (two or three nights)", "L (split it)"]
