[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Finance back office automation for Max ASP GmbH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    # check.py in tests/fixtures/tools needs this to read the PDF fixtures
    "pypdf>=5.0,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "req(*ids): requirement IDs from docs/requirements/requirements.md that this test covers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The fixture generator is a standalone script with its own style; check.py still runs in CI.
extend-exclude = ["tests/fixtures/tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/tools/"]
