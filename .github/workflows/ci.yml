name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    # The case store tests need a real PostgreSQL (ADR 0005). It lives only for this job, so it
    # needs no password.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_owner@localhost:5432/argus_test
      # Azurite, the local stand in for Azure Blob Storage (ADR 0001). No real account or key.
      ARGUS_TEST_BLOB_CONNECTION_STRING: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tesseract reads the scans in CI instead of Azure AI Document Intelligence (#29).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
      # The restore tests (#82) dump and restore the test database. The runner's own pg_dump is
      # newer than the PostgreSQL 16 service and writes settings 16 does not know, so the tests
      # use pg_dump and pg_restore from the same postgres:16 image as the service, as the
      # restore runbook asks for the server's own version.
      - name: Use the PostgreSQL 16 tools
        run: |
          mkdir -p "$RUNNER_TEMP/pg16"
          for tool in pg_dump pg_restore; do
            printf "#!/bin/sh\nexec docker run --rm -i --network host postgres:16 %s \"\$@\"\n" "$tool" \
              > "$RUNNER_TEMP/pg16/$tool"
            chmod +x "$RUNNER_TEMP/pg16/$tool"
          done
          echo "$RUNNER_TEMP/pg16" >> "$GITHUB_PATH"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      # Two PRs whose migrations point at the same earlier one would give the database two
      # "latest" versions (#123). Reads the files only, no database needed.
      - name: Migration chain
        run: python tools/check_migrations.py
      # The document store tests need Azurite. A service container cannot take the flag that
      # lets Azurite accept the newest storage API version, so it is started here instead.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:10000/ && exit 0
            sleep 1
          done
          docker logs azurite
          exit 1
      # The official XRechnung validator (ADR 0006, #28). The e-invoice contract tests need it.
      - name: Start the KoSIT validator
        run: |
          docker build -f docker/kosit-validator/Dockerfile -t argus-kosit-validator .
          docker run -d --name kosit -p 8090:8080 argus-kosit-validator
          for _ in $(seq 1 120); do
            curl -s -o /dev/null -X POST --data-binary '<a/>' http://localhost:8090/ && exit 0
            sleep 1
          done
          docker logs kosit
          exit 1
      - name: Tests
        env:
          ARGUS_KOSIT_URL: http://localhost:8090/
        run: pytest --cov=argus --cov-report=term
      # AC-1 to AC-8 against the stand ins: pass, fail or not run per AC, in the job summary (#66).
      - name: Acceptance tests
        env:
          ARGUS_KOSIT_URL: http://localhost:8090/
        run: python tools/acceptance.py --markdown "$GITHUB_STEP_SUMMARY"
      - name: Fixture check
        run: python tests/fixtures/tools/check.py
      # ARGUS must never fund or release a payment (NF-04, ADR 0004).
      - name: No Wise funding path
        run: python tools/check_no_funding_paths.py

  wise-standin:
    name: Wise stand in
    runs-on: ubuntu-latest
    env:
      WISE_STANDIN_TOKEN: ci-standin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the stand in image
        run: docker build -f standins/wise/Dockerfile -t argus-wise-standin .
      - name: Start the stand in
        run: |
          docker run -d --name wise-standin -p 8080:8080 -e WISE_STANDIN_TOKEN argus-wise-standin
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_standin/records && break; sleep 1; done
      - name: Smoke test the Wise client against it
        run: python tools/smoke_wise_standin.py http://localhost:8080 "$WISE_STANDIN_TOKEN"

  graph-standin:
    name: Graph stand in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the stand in image
        run: docker build -f standins/graph/Dockerfile -t argus-graph-standin .
      # The token is shaped like an Entra token but unsigned; it works nowhere but the fake.
      - name: Start the stand in
        run: |
          TOKEN=$(python -c "from standins.graph.app import fake_token; print(fake_token(['Mail.ReadWrite', 'Mail.Send']))")
          echo "GRAPH_STANDIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name graph-standin -p 8081:8081 -e GRAPH_STANDIN_TOKEN="$TOKEN" argus-graph-standin
          for _ in $(seq 1 30); do curl -sf http://localhost:8081/_standin/records && exit 0; sleep 1; done
          docker logs graph-standin
          exit 1
      - name: Smoke test the Graph client against it
        run: python tools/smoke_graph_standin.py http://localhost:8081/v1.0 "$GRAPH_STANDIN_TOKEN"

  fake-datev:
    name: DATEV contract tests on the Docker fake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the fake DATEV
        run: docker build -f docker/fake-datev/Dockerfile -t argus-fake-datev .
      - name: Start the fake DATEV
        run: |
          docker run -d --name fake-datev -p 58452:58452 argus-fake-datev
          for _ in $(seq 1 30); do
            curl -sf http://localhost:58452/health && exit 0
            sleep 1
          done
          docker logs fake-datev
          exit 1
      - name: Contract tests
        env:
          ARGUS_DATEV_CONTRACT_URL: http://localhost:58452
        run: pytest tests/contract/datev -v
      - name: Fake DATEV log
        if: always()
        run: docker logs fake-datev || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c
          tar xzf gitleaks.tgz gitleaks
      # Only the history of the commit under test, so a secret on another branch
      # does not turn this run red. Each branch is checked by its own runs.
      - name: Scan the git history
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="--full-history HEAD" .


  infra:
    name: Infrastructure code
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.33.93
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Compiles and lints the Azure setup (#65) without signing in to Azure or deploying
      # anything. The preview against the real subscription is in infra-preview.yml (#81).
      - name: Install Bicep
        run: |
          az bicep install --version "$BICEP_VERSION"
          az bicep version
      - name: Build the templates
        run: |
          mkdir -p build/infra
          az bicep build --file infra/main.bicep --outdir build/infra
          az bicep build --file infra/policy/eu-only.bicep --outdir build/infra
          az bicep build-params --file infra/main.bicepparam --outfile build/infra/main.parameters.json
      - name: Lint the templates
        run: |
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/policy/eu-only.bicep
      # Region, retention lock, secrets and deployment types (NF-01, NF-03, NF-06, ADR 0006).
      - name: Check the rules of #65
        run: python tools/check_infra.py build/infra

  pipeline:
    name: Deploy pipeline
    runs-on: ubuntu-latest
    # Rehearses the deploy from #81 without Azure: the same image, the same migration and role
    # steps against a local PostgreSQL, and the same smoke test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACTIONLINT_VERSION: 1.7.12.25
      SHELLCHECK_VERSION: 0.11.0.1
      # Like Azure: no user in the URL, the admin comes from PGUSER.
      ARGUS_DATABASE_URL: postgresql+psycopg://localhost:5432/argus
      PGUSER: argus_owner
      PGHOST: localhost
      APP_IDENTITY_NAME: id-argus-app
      APP_IDENTITY_OBJECT_ID: 55555555-6666-7777-8888-999999999999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install "actionlint-py==$ACTIONLINT_VERSION" "shellcheck-py==$SHELLCHECK_VERSION"
      - name: Lint the workflows and scripts
        run: |
          actionlint
          shellcheck tools/azure/*.sh
      # OpenID Connect only, main only, migrations before the new image, no lock, no secrets,
      # no Wise, and a preview that changes nothing.
      - name: Check the rules of #81
        run: python tools/check_pipeline.py
      - name: Build the app image
        run: docker build --build-arg ARGUS_BUILD="$GITHUB_SHA" --tag argus:ci .
      - name: The app does not run as root
        run: test "$(docker run --rm argus:ci id -u)" != "0"
      - name: Run the migrations as the admin
        run: python tools/deploy.py migrate
      - name: Give the app identity its database role and keep the database in the backup
        run: |
          psql --dbname postgres --file standins/postgres/pgaadauth.sql
          python tools/deploy.py app-db-role \
            --identity-name "$APP_IDENTITY_NAME" --object-id "$APP_IDENTITY_OBJECT_ID"
          python tools/deploy.py database-owner
      - name: Start the app like Azure does
        run: |
          docker run -d --name argus --network host \
            -e ARGUS_DATABASE_URL="postgresql+psycopg://$APP_IDENTITY_NAME@localhost:5432/argus" \
            -e ARGUS_DATABASE_ROLE=argus_app \
            argus:ci
      - name: Smoke test
        run: python tools/deploy.py smoke --url http://localhost:8000 --build "$GITHUB_SHA" --timeout 60 --interval 2
      - name: App log
        if: always()
        run: docker logs argus || true

  demo:
    name: Demo rehearsal
    runs-on: ubuntu-latest
    # Rehearses the demo from #124 without Azure: the stand ins from the argus-demo image with
    # the same commands as infra/modules/standins.bicep, the seed job, the start up guard of the
    # app image and the reset against a local PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: argus_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the demo image and the app image
        run: |
          docker build --file docker/demo/Dockerfile --tag argus-demo:ci .
          docker build --build-arg ARGUS_BUILD="$GITHUB_SHA" --tag argus:ci .
      - name: The demo image does not run as root
        run: test "$(docker run --rm argus-demo:ci id -u)" != "0"
      # Same names, commands and settings as in Azure. Only the ports are published here so the
      # runner can look at the stand ins; in Azure nothing outside the environment reaches them.
      - name: Start the stand ins like Azure does
        run: |
          GRAPH_TOKEN=$(python -c "from standins.graph.app import fake_token; print(fake_token(['Mail.ReadWrite', 'Mail.Send']))")
          PAY_TOKEN="standin-$(python -c 'import uuid; print(uuid.uuid4())')"
          {
            echo "ARGUS_GRAPH_STANDIN_TOKEN=$GRAPH_TOKEN"
            echo "ARGUS_WISE_STANDIN_TOKEN=$PAY_TOKEN"
          } >> "$GITHUB_ENV"
          docker network create demo
          docker run -d --name ca-argus-standin-graph --network demo -p 8081:8081 \
            -e GRAPH_STANDIN_TOKEN="$GRAPH_TOKEN" -e GRAPH_STANDIN_START_EMPTY=true argus-demo:ci \
            uvicorn standins.graph.app:app --host 0.0.0.0 --port 8081
          docker run -d --name ca-argus-standin-datev --network demo -p 58452:58452 argus-demo:ci \
            uvicorn argus.datev.fake:app_from_env --factory --host 0.0.0.0 --port 58452
          docker run -d --name ca-argus-standin-wise --network demo -p 8080:8080 \
            -e WISE_STANDIN_TOKEN="$PAY_TOKEN" argus-demo:ci \
            uvicorn standins.wise.app:app --host 0.0.0.0 --port 8080
          for url in http://localhost:8081/_standin/records http://localhost:58452/health http://localhost:8080/_standin/records; do
            for _ in $(seq 1 30); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null || { docker ps -a; exit 1; }
          done
          test "$(curl -sf http://localhost:8081/_standin/records | jq .inbox)" = 0
      - name: Run the seed job like Azure does
        run: |
          docker run --rm --network demo \
            -e ARGUS_DEMO=true \
            -e ARGUS_GRAPH_URL=http://ca-argus-standin-graph:8081/v1.0 \
            -e ARGUS_MAILBOX=accounts@maxasp.example \
            -e ARGUS_GRAPH_STANDIN_TOKEN \
            argus-demo:ci python -m argus.demo seed
          test "$(curl -sf http://localhost:8081/_standin/records | jq .inbox)" = 10
      - name: The seed refuses when demo mode is off
        run: |
          if docker run --rm --network demo -e ARGUS_DEMO=false argus-demo:ci python -m argus.demo seed; then
            echo "::error::seed ran with demo mode off"
            exit 1
          fi
      - name: The app refuses to start when demo mode and real settings mix
        run: |
          set +e
          docker run --rm -e ARGUS_DEMO=true -e ARGUS_WISE_URL=https://api.wise.com argus:ci > mixed.log 2>&1
          first=$?
          docker run --rm -e ARGUS_DEMO=false -e ARGUS_GRAPH_URL=http://ca-argus-standin-graph/v1.0 argus:ci >> mixed.log 2>&1
          second=$?
          set -e
          cat mixed.log
          test "$first" != 0 && test "$second" != 0
          grep -q "demo mode is on but ARGUS_WISE_URL is not a stand in address" mixed.log
          grep -q "demo mode is off but ARGUS_GRAPH_URL is not an https address" mixed.log
      - name: The app starts in demo mode with the stand in settings
        run: |
          docker run -d --name argus --network demo -p 8000:8000 \
            -e ARGUS_DEMO=true \
            -e ARGUS_GRAPH_URL=http://ca-argus-standin-graph:8081/v1.0 \
            -e ARGUS_MAILBOX=accounts@maxasp.example \
            -e ARGUS_DATEV_URL=http://ca-argus-standin-datev:58452 \
            -e ARGUS_DATEV_CLIENT=muster-gmbh \
            -e ARGUS_WISE_URL=http://ca-argus-standin-wise:8080 \
            -e ARGUS_WISE_PROFILE_ID=16000001 \
            -e ARGUS_GRAPH_STANDIN_TOKEN -e ARGUS_WISE_STANDIN_TOKEN \
            argus:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          docker logs argus
          exit 1
      # NF-04: the Wise stand in in the demo image still cannot fund or release anything.
      - name: The Wise stand in cannot fund or release a batch
        run: python tools/smoke_wise_standin.py http://localhost:8080 "$ARGUS_WISE_STANDIN_TOKEN"
      - name: Reset the demo
        env:
          ARGUS_DATABASE_URL: postgresql+psycopg://argus_owner@localhost:5432/argus_demo
          ARGUS_DEMO: "true"
          ARGUS_GRAPH_URL: http://localhost:8081/v1.0
          ARGUS_DATEV_URL: http://localhost:58452
          ARGUS_WISE_URL: http://localhost:8080
        run: |
          python -m argus.demo reset --standins
          test "$(curl -sf http://localhost:8081/_standin/records | jq .inbox)" = 0
          test "$(curl -sf http://localhost:8080/_standin/records | jq '.transfers | length')" = 0
          psql "postgresql://argus_owner@localhost:5432/argus_demo" -tAc "select version_num from alembic_version"
      - name: The reset refuses the real database
        env:
          ARGUS_DATABASE_URL: postgresql+psycopg://argus_owner@localhost:5432/argus
          ARGUS_DEMO: "true"
        run: |
          if python -m argus.demo reset; then
            echo "::error::reset ran against a database whose name does not end in _demo"
            exit 1
          fi
      # The scheduled intake jobs from #125, with the same command and the same settings as in
      # Azure (infra/modules/apps.bicep), as the app identity would get them. CI has no Azure
      # OpenAI or Document Intelligence, so the jobs run on the empty mailbox after the reset;
      # tests/integration/test_intake_jobs.py shows one run turning new emails into cases.
      - name: Write the settings the intake jobs get in Azure
        run: |
          cat > intake.env <<'EOF'
          ARGUS_DEMO=true
          ARGUS_GRAPH_URL=http://localhost:8081/v1.0
          ARGUS_MAILBOX=accounts@maxasp.example
          ARGUS_REMINDER_FORWARD_TO=reminders@maxasp.example
          ARGUS_DATABASE_URL=postgresql+psycopg://argus_owner@localhost:5432/argus_demo
          ARGUS_DOCUMENTS_CONNECTION_STRING=UseDevelopmentStorage=true
          AZURE_OPENAI_ENDPOINT=https://openai.invalid
          AZURE_OPENAI_DEPLOYMENT=argus-sorting
          AZURE_OPENAI_API_KEY=not-used-on-an-empty-mailbox
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=https://reader.invalid
          AZURE_DOCUMENT_INTELLIGENCE_API_KEY=not-used-on-an-empty-mailbox
          ARGUS_OWN_DOMAIN=maxasp.example
          ARGUS_INVOICING_AGENT=rechnungen@maxasp.example
          ARGUS_OWN_VAT_IDS=DE099000001
          ARGUS_VENDOR_DOMAINS=muster-buerobedarf.example,beispiel-cloud.example
          ARGUS_CUSTOMER_DOMAINS=beispiel-handel.example
          EOF
      - name: Run the sweep and the removal jobs like Azure does
        run: |
          for job in sweep removal; do
            docker run --rm --network host --env-file intake.env -e ARGUS_GRAPH_STANDIN_TOKEN \
              argus:ci python -m argus.intake "$job" | tee "$job.log"
            grep -q "argus-job ok $job" "$job.log"
          done
      # What the alert in infra/modules/alerts.bicep looks for when the database is down.
      - name: A sweep that cannot reach the database fails and says so
        run: |
          set +e
          docker run --rm --network host --env-file intake.env -e ARGUS_GRAPH_STANDIN_TOKEN \
            -e ARGUS_DATABASE_URL=postgresql+psycopg://argus_owner@localhost:1/argus_demo \
            argus:ci python -m argus.intake sweep > failed.log 2>&1
          code=$?
          set -e
          cat failed.log
          test "$code" = 1
          grep -q "argus-job failed sweep" failed.log
          # Errors as type and codes only, never a traceback with the error's text (NF-03).
          grep -q "error: OperationalError" failed.log
          if grep -q "Traceback" failed.log; then echo "::error::the job log holds a traceback"; exit 1; fi
      - name: Stand in logs
        if: always()
        run: |
          for name in ca-argus-standin-graph ca-argus-standin-datev ca-argus-standin-wise argus; do
            echo "== $name"; docker logs "$name" 2>&1 | tail -n 50 || true
          done
