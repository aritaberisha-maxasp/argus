name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    # The case store tests need a real PostgreSQL (ADR 0005). It lives only for this job, so it
    # needs no password.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_owner@localhost:5432/argus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=argus --cov-report=term
      - name: Fixture check
        run: python tests/fixtures/tools/check.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c
          tar xzf gitleaks.tgz gitleaks
      # Only the history of the commit under test, so a secret on another branch
      # does not turn this run red. Each branch is checked by its own runs.
      - name: Scan the git history
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="--full-history HEAD" .
