<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>ARGUS exception queue</title>
  <!-- sign in settings -->
  <link rel="icon" href="/queue/favicon-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="/queue/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/queue/app.css">
  <script src="/queue/msal-browser.min.js" defer></script>

<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/queue">

      </a>
      <nav class="nav" aria-label="Main">
        <a href="/queue" aria-current="page">Exceptions</a>
      </nav>
      <div class="account">
        <span>Max ASP</span>
        <span id="who" class="badge" role="img" aria-label="Not signed in"></span>
      </div>
    </div>
  </header>
  <main id="main">
    <p id="status" class="state">Loading…</p>
  </main>
