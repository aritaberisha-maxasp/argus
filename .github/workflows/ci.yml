name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    # The case store tests need a real PostgreSQL (ADR 0005). It lives only for this job, so it
    # needs no password.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_owner@localhost:5432/argus_test
      # Azurite, the local stand in for Azure Blob Storage (ADR 0001). No real account or key.
      ARGUS_TEST_BLOB_CONNECTION_STRING: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tesseract reads the scans in CI instead of Azure AI Document Intelligence (#29).
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      # The document store tests need Azurite. A service container cannot take the flag that
      # lets Azurite accept the newest storage API version, so it is started here instead.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:10000/ && exit 0
            sleep 1
          done
          docker logs azurite
          exit 1
      - name: Tests
        run: pytest --cov=argus --cov-report=term
      - name: Fixture check
        run: python tests/fixtures/tools/check.py
      # ARGUS must never fund or release a payment (NF-04, ADR 0004).
      - name: No Wise funding path
        run: python tools/check_no_funding_paths.py

  wise-standin:
    name: Wise stand in
    runs-on: ubuntu-latest
    env:
      WISE_STANDIN_TOKEN: ci-standin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the stand in image
        run: docker build -f standins/wise/Dockerfile -t argus-wise-standin .
      - name: Start the stand in
        run: |
          docker run -d --name wise-standin -p 8080:8080 -e WISE_STANDIN_TOKEN argus-wise-standin
          for i in $(seq 1 30); do curl -sf http://localhost:8080/_standin/records && break; sleep 1; done
      - name: Smoke test the Wise client against it
        run: python tools/smoke_wise_standin.py http://localhost:8080 "$WISE_STANDIN_TOKEN"

  graph-standin:
    name: Graph stand in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the stand in image
        run: docker build -f standins/graph/Dockerfile -t argus-graph-standin .
      # The token is shaped like an Entra token but unsigned; it works nowhere but the fake.
      - name: Start the stand in
        run: |
          TOKEN=$(python -c "from standins.graph.app import fake_token; print(fake_token(['Mail.ReadWrite', 'Mail.Send']))")
          echo "GRAPH_STANDIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name graph-standin -p 8081:8081 -e GRAPH_STANDIN_TOKEN="$TOKEN" argus-graph-standin
          for i in $(seq 1 30); do curl -sf http://localhost:8081/_standin/records && exit 0; sleep 1; done
          docker logs graph-standin
          exit 1
      - name: Smoke test the Graph client against it
        run: python tools/smoke_graph_standin.py http://localhost:8081/v1.0 "$GRAPH_STANDIN_TOKEN"

  fake-datev:
    name: DATEV contract tests on the Docker fake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the fake DATEV
        run: docker build -f docker/fake-datev/Dockerfile -t argus-fake-datev .
      - name: Start the fake DATEV
        run: |
          docker run -d --name fake-datev -p 58452:58452 argus-fake-datev
          for i in $(seq 1 30); do
            curl -sf http://localhost:58452/health && exit 0
            sleep 1
          done
          docker logs fake-datev
          exit 1
      - name: Contract tests
        env:
          ARGUS_DATEV_CONTRACT_URL: http://localhost:58452
        run: pytest tests/contract -v
      - name: Fake DATEV log
        if: always()
        run: docker logs fake-datev || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c
          tar xzf gitleaks.tgz gitleaks
      # Only the history of the commit under test, so a secret on another branch
      # does not turn this run red. Each branch is checked by its own runs.
      - name: Scan the git history
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="--full-history HEAD" .

  # TEMPORARY (#28): finds the KoSIT XRechnung configuration release and its checksum, so the
  # validator image can pin it. Removed before the PR leaves draft.
  kosit-discovery:
    name: KoSIT discovery (temporary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/itplr-kosit/validator-configuration-xrechnung/releases --jq '.[0:3][] | .tag_name + " " + .published_at + " " + ([.assets[] | .name + " " + .browser_download_url] | join(" | "))'
      - name: Download the newest configuration and the engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/itplr-kosit/validator-configuration-xrechnung/releases --jq '.[0].assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -1)
          echo "URL $url"
          curl -sSfL -o config.zip "$url"
          echo "SHA256 $(sha256sum config.zip)"
          unzip -l config.zip | head -40
          unzip -o -q config.zip -d config
          curl -sSfL -o validator.jar https://repo.maven.apache.org/maven2/de/kosit/validationtool/1.5.0/validationtool-1.5.0-standalone.jar
          sha256sum validator.jar
      - name: Try the daemon
        run: |
          cd config
          java -jar ../validator.jar --help 2>&1 | head -60 || true
          nohup java -jar ../validator.jar -s scenarios.xml -r . -D -H 0.0.0.0 -P 8080 > ../daemon.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 1; done
          cd ..
          head -30 daemon.log
          curl -s -i http://localhost:8080/ | head -20
          python3 -c "from pypdf import PdfReader" 2>/dev/null || pip install -q pypdf
          python3 -c "
          from pypdf import PdfReader
          open('d09.xml','wb').write(PdfReader('tests/fixtures/documents/D09_Rechnung_BB-2026-1243_zugferd.pdf').attachments['factur-x.xml'][0])"
          for f in tests/fixtures/documents/D08_Rechnung_BCH-26-10-0057_xrechnung.xml tests/fixtures/documents/D24_Rechnung_MA-2026-0104_xrechnung.xml d09.xml; do
            echo "=== $f"
            curl -s -i -X POST -H "Content-Type: application/xml" --data-binary @"$f" http://localhost:8080/ | head -c 6000
            echo
          done
          echo "=== not an invoice"
          curl -s -i -X POST -H "Content-Type: application/xml" --data-binary '<a/>' http://localhost:8080/ | head -c 3000
          echo "=== broken"
          curl -s -i -X POST -H "Content-Type: application/xml" --data-binary '<a>' http://localhost:8080/ | head -c 3000
