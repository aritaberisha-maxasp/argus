# Shows what a PR would change in Azure, without changing anything (#81).
#
# Signs in as the preview identity: it may read the ARGUS resource group and ask Azure for a
# what if, nothing else. It cannot deploy, push images, reach the database or read secrets.
# Before Azure is set up, the job skips the preview with a notice and stays green.
name: Infrastructure preview

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra-preview.yml"
      - "tools/azure/**"

permissions:
  contents: read

concurrency:
  group: infra-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BICEP_VERSION: v0.33.93
  APP_NAME: ca-argus-web
  PLACEHOLDER_IMAGE: mcr.microsoft.com/k8se/quickstart:latest
  PLACEHOLDER_PORT: "80"

jobs:
  config:
    name: Is Azure set up?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Check the GitHub variables
        id: check
        env:
          AZURE_PREVIEW_CLIENT_ID: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARGUS_RESOURCE_GROUP: ${{ vars.ARGUS_RESOURCE_GROUP }}
          ARGUS_DATABASE_ADMIN_OBJECT_ID: ${{ vars.ARGUS_DATABASE_ADMIN_OBJECT_ID }}
          ARGUS_DATABASE_ADMIN_NAME: ${{ vars.ARGUS_DATABASE_ADMIN_NAME }}
          ARGUS_ENTRA_TENANT_ID: ${{ vars.ARGUS_ENTRA_TENANT_ID }}
          ARGUS_ENTRA_API_CLIENT_ID: ${{ vars.ARGUS_ENTRA_API_CLIENT_ID }}
          ARGUS_ENTRA_GROUP_APPROVER: ${{ vars.ARGUS_ENTRA_GROUP_APPROVER }}
          ARGUS_ENTRA_GROUP_FINANCE: ${{ vars.ARGUS_ENTRA_GROUP_FINANCE }}
          ARGUS_ENTRA_GROUP_ADMIN: ${{ vars.ARGUS_ENTRA_GROUP_ADMIN }}
        run: python tools/deploy.py check-config --mode preview

  preview:
    name: What would change in Azure
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.ARGUS_RESOURCE_GROUP }}
      ARGUS_DATABASE_ADMIN_OBJECT_ID: ${{ vars.ARGUS_DATABASE_ADMIN_OBJECT_ID }}
      ARGUS_DATABASE_ADMIN_NAME: ${{ vars.ARGUS_DATABASE_ADMIN_NAME }}
      ARGUS_OWN_DOMAIN: ${{ vars.ARGUS_OWN_DOMAIN }}
      ARGUS_INVOICING_AGENT: ${{ vars.ARGUS_INVOICING_AGENT }}
      ARGUS_OWN_VAT_IDS: ${{ vars.ARGUS_OWN_VAT_IDS }}
      ARGUS_VENDOR_DOMAINS: ${{ vars.ARGUS_VENDOR_DOMAINS }}
      ARGUS_CUSTOMER_DOMAINS: ${{ vars.ARGUS_CUSTOMER_DOMAINS }}
      # The sign in IDs (#133) are not personal, so the preview shows them like the deploy sets them.
      ARGUS_ENTRA_TENANT_ID: ${{ vars.ARGUS_ENTRA_TENANT_ID }}
      ARGUS_ENTRA_API_CLIENT_ID: ${{ vars.ARGUS_ENTRA_API_CLIENT_ID }}
      ARGUS_ENTRA_GROUP_APPROVER: ${{ vars.ARGUS_ENTRA_GROUP_APPROVER }}
      ARGUS_ENTRA_GROUP_FINANCE: ${{ vars.ARGUS_ENTRA_GROUP_FINANCE }}
      ARGUS_ENTRA_GROUP_ADMIN: ${{ vars.ARGUS_ENTRA_GROUP_ADMIN }}
      # ARGUS_ALERT_EMAIL is left out on purpose: the preview prints every changed value into
      # the run summary, and the address belongs to a person. The preview may therefore show
      # the alert email receiver as removed; the deploy keeps it (#125).
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install --version "$BICEP_VERSION"

      - name: Look up the running version
        id: current
        run: tools/azure/current_app.sh >> "$GITHUB_OUTPUT"

      # Compared with the running image, so the preview shows only what the PR changes.
      # ProviderNoRbac checks read rights only, which is all the preview identity has.
      - name: Preview the changes
        env:
          ARGUS_APP_IMAGE: ${{ steps.current.outputs.image }}
          ARGUS_APP_PORT: ${{ steps.current.outputs.port }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "argus-preview-$GITHUB_RUN_ID" \
            --parameters infra/main.bicepparam \
            --validation-level ProviderNoRbac \
            | sed 's/\x1b\[[0-9;]*m//g' | tee what-if.txt
          {
            echo "## What this PR would change in Azure"
            echo
            echo '```'
            cat what-if.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
